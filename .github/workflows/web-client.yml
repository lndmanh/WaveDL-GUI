name: Static web client

on:
  workflow_call:
  push:
    paths:
      - 'web/**'
      - 'tools/vendor_web_assets.py'
      - 'src/wavedl_daemon/http/static.py'
      - 'src/wavedl_daemon/http/app.py'
      - 'pyproject.toml'
      - 'unit_tests/daemon/test_*web*.py'
      - '.github/workflows/web-client.yml'
  pull_request:
    paths:
      - 'web/**'
      - 'tools/vendor_web_assets.py'
      - 'src/wavedl_daemon/http/static.py'
      - 'src/wavedl_daemon/http/app.py'
      - 'pyproject.toml'
      - 'unit_tests/daemon/test_*web*.py'
      - '.github/workflows/web-client.yml'

permissions:
  contents: read

concurrency:
  group: static-web-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  static-client:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run lint:workstation
      - run: npm run format:check
      - run: npm run typecheck
      - run: npm test
      - run: npm run generate
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install 'starlette>=1.3.0,<2' 'anyio>=4,<5' 'httpx>=0.28,<1'
      - run: python ../tools/vendor_web_assets.py
      - run: npm run test:generated
      - uses: actions/upload-artifact@v4
        with:
          name: wavedl-static-client
          path: web/.output/public
          if-no-files-found: error
