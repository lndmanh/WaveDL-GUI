name: Installed wheel browser acceptance

on:
  push:
    paths: &installed-paths
      - "src/wavedl/**"
      - "src/wavedl_daemon/**"
      - "src/wavedl_daemon/web/**"
      - "pyproject.toml"
      - "MANIFEST.in"
      - "tools/**"
      - "unit_tests/test_ci_required_gates.py"
      - ".github/workflows/installed-browser-acceptance.yml"
  pull_request:
    paths: *installed-paths
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: installed-browser-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  installed-browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    defaults:
      run:
        shell: bash
    env:
      CUDA_VISIBLE_DEVICES: ""
      OMP_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
      OPENBLAS_NUM_THREADS: "1"
      MPLBACKEND: Agg
      WANDB_MODE: disabled
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: src/wavedl_daemon/web/package-lock.json
      - name: Install build and source-contract tools only
        run: |
          python -m pip install build pytest pyyaml 'ruff==0.14.10'
          python - <<'PY'
          import subprocess, sys, tomllib
          from pathlib import Path
          requirements = tomllib.loads(Path("pyproject.toml").read_text())["build-system"]["requires"]
          subprocess.run([sys.executable, "-m", "pip", "install", *requirements], check=True)
          PY
      - name: Test required gates and installed-browser product evidence
        run: |
          python -m pytest --noconftest unit_tests/test_ci_required_gates.py -q
          node --test tools/verify_installed_browser_report.test.mjs
      - name: Install pinned native browser controller
        run: |
          npm install --global agent-browser@0.26.0
          test "$(agent-browser --version)" = 'agent-browser 0.26.0'
          agent-browser install --with-deps
      - name: Generate locked browser assets
        working-directory: src/wavedl_daemon/web
        run: |
          npm ci
          npm run generate
      - name: Vendor verified current browser assets
        run: python tools/vendor_web_assets.py
      # This bounded lane certifies local Linux CPU only, not GPU, other OSes,
      # real HPC sites, remote filesystems or overall release readiness.
      - name: Build exact wheel in clean tracked-source staging
        run: |
          python - <<'PY'
          import hashlib, json, os, shutil, subprocess, sys, tempfile, zipfile
          from pathlib import Path, PurePosixPath
          from tools.vendor_web_assets import inventory
          checkout = Path.cwd()
          owned = Path(tempfile.mkdtemp(prefix="wavedl-installed-browser-", dir=os.environ["RUNNER_TEMP"]))
          stage, dist = owned / "source", owned / "dist"
          stage.mkdir()
          reports, evidence, wheelhouse = owned / "reports", owned / "evidence", owned / "wheelhouse"
          for directory in (reports, evidence, wheelhouse):
              directory.mkdir(mode=0o700)
          archive = owned / "source.zip"
          subprocess.run(["git", "archive", "--format=zip", "HEAD", "-o", str(archive)], check=True)
          with zipfile.ZipFile(archive) as source:
              for member in source.infolist():
                  name = PurePosixPath(member.filename)
                  assert not name.is_absolute() and ".." not in name.parts
              source.extractall(stage)
          assets = checkout / "src/wavedl_daemon/web_assets"
          expected = {path.relative_to(assets).as_posix(): path.read_bytes() for path in assets.rglob("*") if path.is_file()}
          assert inventory(assets, managed=True) == json.loads(expected[".wavedl-assets.json"])
          assert {"index.html", ".wavedl-assets.json"} <= expected.keys()
          target = stage / "src/wavedl_daemon/web_assets"
          if target.exists():
              shutil.rmtree(target)
          shutil.copytree(assets, target)
          assert not (stage / "build").exists(), "Clean staging must not reuse build/lib"
          subprocess.run([sys.executable, "-m", "build", "--wheel", "--no-isolation", "--outdir", str(dist), str(stage)], check=True)
          wheels = list(dist.glob("*.whl"))
          assert len(wheels) == 1
          wheel = wheels[0]
          with zipfile.ZipFile(wheel) as built:
              names = built.namelist()
              assert len(names) == len(set(names)), "Duplicate wheel entries"
              assert not any(name.startswith("wavedl_gui/") for name in names)
              prefix = "wavedl_daemon/web_assets/"
              actual = {name[len(prefix):]: built.read(name) for name in names if name.startswith(prefix) and not name.endswith("/")}
              assert actual == expected, "Wheel must preserve every current vendored asset byte"
          sha = hashlib.sha256(wheel.read_bytes()).hexdigest()
          proof = {"scope": "local Linux installed browser CPU only", "source_commit": os.environ["GITHUB_SHA"], "wheel": wheel.name, "wheel_sha256": sha, "asset_manifest_sha256": hashlib.sha256(expected[".wavedl-assets.json"]).hexdigest(), "assets": {name: hashlib.sha256(data).hexdigest() for name, data in expected.items()}}
          (evidence / "build-manifest.json").write_text(json.dumps(proof, sort_keys=True))
          (evidence / "wheel.sha256").write_text(f"{sha}  {wheel.name}\n")
          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as output:
              output.write(f"WAVEDL_ACCEPTANCE_WHEEL={wheel}\nWAVEDL_ACCEPTANCE_WHEEL_SHA256={sha}\nWAVEDL_ACCEPTANCE_WHEELHOUSE={wheelhouse}\nWAVEDL_ACCEPTANCE_REPORTS={reports}\nWAVEDL_ACCEPTANCE_EVIDENCE={evidence}\n")
          PY
      - name: Resolve complete offline daemon wheelhouse with CPU PyTorch
        run: |
          python -m pip download torch torchvision --no-deps --only-binary=:all: --dest "$WAVEDL_ACCEPTANCE_WHEELHOUSE" --index-url https://download.pytorch.org/whl/cpu
          python - <<'PY'
          import email.parser, os, zipfile
          from pathlib import Path
          wheelhouse = Path(os.environ["WAVEDL_ACCEPTANCE_WHEELHOUSE"])
          constraints = []
          for wheel in sorted(wheelhouse.glob("*.whl")):
              with zipfile.ZipFile(wheel) as archive:
                  metadata = email.parser.Parser().parsestr(archive.read(next(name for name in archive.namelist() if name.endswith(".dist-info/METADATA"))).decode())
              assert metadata["Name"] in {"torch", "torchvision"}
              assert "+cpu" in metadata["Version"]
              constraints.append(f'{metadata["Name"]}=={metadata["Version"]}')
          assert len(constraints) == 2
          (wheelhouse.parent / "cpu-constraints.txt").write_text("\n".join(constraints) + "\n")
          PY
          python -m pip download "$WAVEDL_ACCEPTANCE_WHEEL[daemon]" --only-binary=:all: --dest "$WAVEDL_ACCEPTANCE_WHEELHOUSE" --find-links "$WAVEDL_ACCEPTANCE_WHEELHOUSE" --constraint "$(dirname "$WAVEDL_ACCEPTANCE_WHEELHOUSE")/cpu-constraints.txt" --extra-index-url https://download.pytorch.org/whl/cpu
      - name: Run actual installed console and browser outside checkout
        run: node tools/run_installed_browser_acceptance.mjs "$WAVEDL_ACCEPTANCE_WHEEL" "$WAVEDL_ACCEPTANCE_REPORTS" "$WAVEDL_ACCEPTANCE_WHEELHOUSE" "$WAVEDL_ACCEPTANCE_WHEEL_SHA256"
      - name: Require exact successful installed-browser evidence and cleanup
        id: verify
        if: always()
        run: |
          node tools/verify_installed_browser_report.mjs "$WAVEDL_ACCEPTANCE_REPORTS/installed-browser.json" "$WAVEDL_ACCEPTANCE_WHEEL_SHA256"
          python - <<'PY'
          import json, os, stat
          from pathlib import Path
          reports = Path(os.environ["WAVEDL_ACCEPTANCE_REPORTS"])
          info = reports.lstat()
          assert stat.S_ISDIR(info.st_mode) and not reports.is_symlink()
          assert stat.S_IMODE(info.st_mode) == 0o700 and info.st_uid == os.getuid()
          assert sorted(path.name for path in reports.iterdir()) == ["installed-browser.json"]
          report = json.loads((reports / "installed-browser.json").read_text())
          evidence = Path(os.environ["WAVEDL_ACCEPTANCE_EVIDENCE"])
          proof = json.loads((evidence / "build-manifest.json").read_text())
          assert report["wheelSha256"] == proof["wheel_sha256"] == os.environ["WAVEDL_ACCEPTANCE_WHEEL_SHA256"]
          assert report["installation"]["assets"] == proof["assets"]
          assert report["installation"]["assetManifestSha256"] == proof["asset_manifest_sha256"]
          PY
      - name: Upload only verified nonsecret acceptance evidence
        if: ${{ always() && steps.verify.outcome == 'success' }}
        uses: actions/upload-artifact@v4
        with:
          name: installed-linux-cpu-browser
          path: |
            ${{ env.WAVEDL_ACCEPTANCE_REPORTS }}/installed-browser.json
            ${{ env.WAVEDL_ACCEPTANCE_EVIDENCE }}/build-manifest.json
            ${{ env.WAVEDL_ACCEPTANCE_EVIDENCE }}/wheel.sha256
          if-no-files-found: error
