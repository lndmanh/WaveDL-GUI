  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  # A release caller must not cancel (or be cancelled by) the standalone lane.
  group: daemon-browser-integration-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  chromium-cpu:
    name: Chromium + vendored app + real CPU daemon
    runs-on: ubuntu-latest
    # The measured local twelve-case baseline takes 11m53s. This lane already
    # has 49 sequential acceptance runners plus setup/build and Python cohorts;
    # the additive native SSE gate also needs headroom. Keep a bounded 120m
    # budget; this is not a claim that hosted timing has been certified.
    timeout-minutes: 120
    env:
      MPLBACKEND: Agg
      CUDA_VISIBLE_DEVICES: ""
      OMP_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
      OPENBLAS_NUM_THREADS: "1"
      NUMEXPR_NUM_THREADS: "1"
      PYTHONFAULTHANDLER: "1"
      PYTHONUNBUFFERED: "1"
      WANDB_MODE: disabled
      WAVEDL_PYTHON: python
    steps:
      - name: Create dedicated job temporary directory
        run: |
          # runner context is unavailable in job env; initialize on the runner.
          export TMPDIR="$RUNNER_TEMP/wavedl-browser-ci"
          mkdir -m 700 -p "$TMPDIR"
          printf 'TMPDIR=%s\n' "$TMPDIR" >> "$GITHUB_ENV"
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install CPU PyTorch before project dependencies
        run: python -m pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu
      - name: Install real daemon and ML dependencies
        run: python -m pip install -e ".[dev,daemon]"
      - name: Verify installed dependency and CPU data contracts
        run: |
          python -m pip check
          python -c 'import torch, torchvision, numpy, scipy, h5py, starlette, uvicorn; assert torch.version.cuda is None, "CPU PyTorch required"'
      - name: Install locked web dependencies
        working-directory: web
        run: npm ci
      - name: Require exhaustive field and effective Python export round trips
        working-directory: web
        env:
          WAVEDL_TRAINING_EXPORT_PYTHON: python
        run: npm test -- test/workstation/training-fields-acceptance.test.ts
      - name: Generate the static app used by the daemon
        working-directory: web
        run: npm run generate
      - name: Vendor verified generated assets into the daemon
        run: python tools/vendor_web_assets.py
      - name: Install tested browser CLI and Chromium runtime
        run: |
          npm install --global agent-browser@0.26.0
          agent-browser skills get core
          agent-browser install --with-deps
      - name: Test the fail-closed evidence guard
        run: node --test tools/test_verify_browser_ci_report.mjs
      - name: Test native browser target-selection contracts
        run: node --test tools/browser_actions.test.mjs
      - name: Test bounded dataset PNG evidence decoding
        run: node --test tools/browser_dataset_parity.test.mjs
      - name: Test private bounded failure-prefix retention
        run: node --test tools/browser_failure_evidence.test.mjs
      - name: Test browser QA launch policy
        run: node --test tools/browser_launch_policy.test.mjs
      - name: Test standalone adoption, auth/skew and stream report contracts
        run: node --test tools/verify_adoption_browser_report.test.mjs tools/run_auth_skew_browser_acceptance.test.mjs tools/verify_auth_skew_browser_report.test.mjs tools/verify_stream_browser_report.test.mjs
      - name: Test historical-attempt rollover report contract
        run: node --test tools/verify_adoption_rollover_browser_report.test.mjs
      - name: Test negative adoption evidence and targeted source faults
        run: |
          node --test tools/verify_adoption_negative_browser_report.test.mjs
          python -m pytest unit_tests/daemon/test_browser_adoption_negative_fixture.py -q
      - name: Test mapped automatic-plot evidence and fixture execution
        run: |
          node --test tools/verify_mapped_autoplot_browser_report.test.mjs
          node --test tools/verify_mapped_autoplot_negative_report.test.mjs
          python -m pytest unit_tests/daemon/test_browser_mapped_autoplot_fixture.py -q
      - name: Test malformed preference recovery evidence contract
        run: node --test tools/verify_preferences_browser_report.test.mjs
      - name: Test oversized artifact publication evidence contract
        run: node --test tools/run_artifact_publication_browser_acceptance.test.mjs tools/verify_artifact_publication_browser_report.test.mjs
      - name: Test partial-best publication and strict browser evidence contracts
        run: |
          node --test tools/run_partial_best_browser_acceptance.test.mjs tools/verify_partial_best_browser_report.test.mjs
          python -m pytest unit_tests/test_browser_partial_best_fixture.py unit_tests/test_partial_best_browser_workflow.py -q
      - name: Test automatic-plot metadata integrity evidence contracts
        run: |
          node --test tools/run_autoplot_metadata_integrity_browser_acceptance.test.mjs tools/verify_autoplot_metadata_integrity_report.test.mjs
          python -m pytest unit_tests/test_browser_autoplot_metadata_integrity_fixture.py unit_tests/test_autoplot_metadata_integrity_workflow.py -q
      - name: Test controlled build replacement evidence and workflow contracts
        run: |
          node --test tools/run_cached_build_replacement_browser_acceptance.test.mjs tools/verify_cached_build_replacement_report.test.mjs tools/browser_controller_identity.test.mjs
          python -m pytest --noconftest unit_tests/test_browser_build_replacement_fixture.py unit_tests/test_cached_build_replacement_workflow.py -q
      - name: Test supervised HEADER deadline fixture and evidence contracts
        run: |
          node --test tools/verify_header_deadline_browser_report.test.mjs
          python -m pytest unit_tests/test_header_deadline_fixture.py unit_tests/test_header_deadline_workflow.py -q
      - name: Test instrumented native SSE split evidence and workflow contracts
        run: |
          node --test tools/browser_native_sse_probe.test.mjs tools/verify_native_sse_split_report.test.mjs
          python -m pytest --noconftest unit_tests/test_native_sse_split_fixture.py unit_tests/test_native_sse_split_workflow.py -q
      - name: Test preview resource-budget fixture and evidence contracts
        run: |
          node --test tools/verify_preview_budget_browser_report.test.mjs
          python -m pytest unit_tests/daemon/test_preview_budget_acceptance.py unit_tests/test_preview_budget_workflow.py -q
      - name: Test submitted-plan authoring protection contracts
        run: node --test tools/run_submitted_plan_browser_acceptance.test.mjs tools/verify_submitted_plan_browser_report.test.mjs
      - name: Test result-operation evidence contracts (not browser acceptance)
        run: node --test tools/run_result_operations_browser_acceptance.test.mjs tools/verify_result_operations_browser_report.test.mjs
      - name: Test supported export and inference cancellation evidence contracts
        run: >-
          node --test tools/browser_onnx_export.test.mjs
          tools/run_onnx_export_browser_acceptance.test.mjs
          tools/verify_onnx_export_browser_report.test.mjs
          tools/run_inference_cancellation_browser_acceptance.test.mjs
          tools/verify_inference_cancellation_browser_report.test.mjs
      - name: Test cross-validation publication and explicit-fold evidence contracts
        run: node --test tools/run_cv_parity_browser_acceptance.test.mjs tools/verify_cv_parity_browser_report.test.mjs
      - name: Test guided authoring and acknowledgement evidence contracts
        run: node --test tools/run_wizard_progression_browser_acceptance.test.mjs tools/verify_wizard_progression_browser_report.test.mjs
      - name: Test imported preset authority evidence contracts
        run: >-
          node --test tools/browser_preset_import.test.mjs
          tools/verify_preset_import_browser_report.test.mjs
      - name: Test full training field browser evidence contracts
        run: node --test tools/run_training_fields_browser_acceptance.test.mjs tools/verify_training_fields_browser_report.test.mjs
      - name: Test invalid authoring and runtime refusal evidence contracts
        run: |
          node --test tools/run_training_validation_browser_acceptance.test.mjs tools/verify_training_validation_browser_report.test.mjs
          python -m pytest --noconftest unit_tests/test_migration_acceptance_workflow.py
      - name: Exercise both POSIX registry crash orders and recovery paths
        env:
          WAVEDL_REGISTRY_RECOVERY_REPORT_DIR: ${{ runner.temp }}/wavedl-browser-ci/registry-http-recovery
        run: python -m pytest unit_tests/daemon/test_registry_http_recovery.py --junitxml="$TMPDIR/registry-http-recovery.xml"
      - name: Require real registry rollback, recovery, auth and cleanup evidence
        if: always()
        run: |
          python tools/verify_registry_http_recovery_report.py "$TMPDIR/registry-http-recovery/registry-http-recovery-projection-cursor-rebuild.json" "$TMPDIR/registry-http-recovery/registry-http-recovery-projection-cursor-ingest.json" "$TMPDIR/registry-http-recovery/registry-http-recovery-cursor-projection-rebuild.json" "$TMPDIR/registry-http-recovery/registry-http-recovery-cursor-projection-ingest.json"
          python - <<'PY'
          import os
          import xml.etree.ElementTree as ET
          from pathlib import Path
          root = ET.parse(Path(os.environ["TMPDIR"]) / "registry-http-recovery.xml").getroot()
          cases = list(root.iter("testcase"))
          assert len(cases) == 33
          assert len({(case.get("classname"), case.get("name")) for case in cases}) == 33
          assert all(case.get("classname") == "unit_tests.daemon.test_registry_http_recovery" for case in cases)
          assert not any(list(root.iter(kind)) for kind in ("skipped", "failure", "error"))
          PY
      - name: Exercise metric-bearing POSIX registry crash and recovery matrix
        if: always()
        env:
          WAVEDL_REGISTRY_METRIC_RECOVERY_REPORT_DIR: ${{ runner.temp }}/wavedl-browser-ci/registry-metric-http-recovery
        run: python -m pytest unit_tests/daemon/test_registry_metric_http_recovery.py --junitxml="$TMPDIR/registry-metric-http-recovery.xml"
      - name: Require exact metric rollback, replay, HTTP values and cleanup evidence
        if: always()
        run: |
          python tools/verify_registry_metric_http_recovery_report.py "$TMPDIR/registry-metric-http-recovery/registry-metric-http-recovery-projection-cursor-rebuild.json" "$TMPDIR/registry-metric-http-recovery/registry-metric-http-recovery-projection-cursor-ingest.json" "$TMPDIR/registry-metric-http-recovery/registry-metric-http-recovery-cursor-projection-rebuild.json" "$TMPDIR/registry-metric-http-recovery/registry-metric-http-recovery-cursor-projection-ingest.json"
          python - <<'PY'
          import os
          import xml.etree.ElementTree as ET
          from pathlib import Path
          root = ET.parse(Path(os.environ["TMPDIR"]) / "registry-metric-http-recovery.xml").getroot()
          cases = list(root.iter("testcase"))
          assert len(cases) == 33
          assert len({(case.get("classname"), case.get("name")) for case in cases}) == 33
          assert all(case.get("classname") == "unit_tests.daemon.test_registry_metric_http_recovery" for case in cases)
          matrix = {f"test_metric_transaction_sigkill_preserves_prefix_and_recovers_once[{recovery}-{order}]" for recovery in ("rebuild", "ingest") for order in ("projection-cursor", "cursor-projection")}
          assert {case.get("name") for case in cases if case.get("name", "").startswith("test_metric_transaction_")} == matrix
          assert not any(list(root.iter(kind)) for kind in ("skipped", "failure", "error"))
          PY
      - name: Test metric recovery mandatory workflow contracts
        run: python -m pytest --noconftest unit_tests/test_registry_metric_recovery_workflow.py -q
      - name: Test reducer-derived dashboard state evidence contracts
        run: |
          node --test tools/verify_dashboard_state_browser_report.test.mjs
          python -m pytest unit_tests/test_dashboard_state_browser_fixture.py -q
      - name: Test preview-fault evidence and real fixture barriers
        run: |
          node --test tools/verify_preview_fault_browser_report.test.mjs
          python -m pytest unit_tests/daemon/test_browser_preview_fault_fixture.py -q
      - name: Test cold-offline and pending-cancellation evidence contracts
        run: |
          node --test tools/verify_cold_offline_browser_report.test.mjs tools/verify_pending_cancel_browser_report.test.mjs tools/verify_catalogue_fault_browser_report.test.mjs
          python -m pytest unit_tests/test_browser_catalogue_fault_fixture.py unit_tests/test_browser_pending_cancel_fixture.py unit_tests/test_browser_fixture_metadata.py -q
      - name: Test 100k-history evidence and numerical journal fixture
        run: |
          node --test tools/verify_history_browser_report.test.mjs
          python -m pytest unit_tests/test_history_browser_fixture.py -q
      - name: Test F02 journal-byte fixture boundaries
        run: python -m pytest unit_tests/daemon/test_browser_journal_fault_fixture.py -q
