        run: node tools/run_auth_skew_browser_acceptance.mjs --report="$TMPDIR/auth-skew.json"
      - name: Verify same-daemon auth and skew evidence
        if: always()
        run: node tools/verify_auth_skew_browser_report.mjs "$TMPDIR/auth-skew.json"
      - name: Run authenticated browser stream boundary acceptance
        if: always()
        run: node tools/run_stream_browser_acceptance.mjs --report="$TMPDIR/stream-browser.json"
      - name: Verify authenticated browser stream boundary evidence
        if: always()
        run: node tools/verify_stream_browser_report.mjs "$TMPDIR/stream-browser.json"
      - name: Run sparse and truncated browser stream acceptance
        if: always()
        run: node tools/run_stream_sparse_browser_acceptance.mjs --report="$TMPDIR/stream-sparse-browser.json"
      - name: Require sparse and truncated stream evidence and cleanup
        if: always()
        run: node tools/verify_stream_sparse_browser_report.mjs "$TMPDIR/stream-sparse-browser.json"
      - name: Run reducer-derived dashboard state acceptance
        if: always()
        run: node tools/run_dashboard_state_browser_acceptance.mjs --report="$TMPDIR/dashboard-state-browser.json"
      - name: Verify reducer-derived dashboard state evidence
        if: always()
        run: node tools/verify_dashboard_state_browser_report.mjs "$TMPDIR/dashboard-state-browser.json"
      # Refusal/retirement and bounded quiescence only: neither an attempt
      # rollover nor the private post-retirement cursor is claimed.
      - name: Run malformed JSON stream-control browser refusal acceptance
        if: always()
        run: node tools/run_stream_malformed_browser_acceptance.mjs --report="$TMPDIR/stream-malformed-browser.json"
      - name: Require current-package malformed-control refusal and cleanup
        if: always()
        run: node tools/verify_stream_malformed_browser_report.mjs "$TMPDIR/stream-malformed-browser.json"
      - name: Run invalid UTF-8 stream-control browser refusal acceptance
        if: always()
        run: node tools/run_stream_malformed_browser_acceptance.mjs --invalid-utf8 --report="$TMPDIR/stream-invalid-utf8-browser.json"
      - name: Require current-package invalid UTF-8 refusal and cleanup
        if: always()
        run: node tools/verify_stream_malformed_browser_report.mjs "$TMPDIR/stream-invalid-utf8-browser.json"
      # Additive F02 byte/framing faults; existing stream-control gates remain.
      - name: Run real F02 journal-byte fault browser acceptance
        if: always()
        run: node tools/run_journal_fault_browser_acceptance.mjs --report="$TMPDIR/journal-fault-browser.json"
      - name: Require current-package journal-byte evidence and owned cleanup
        if: always()
        run: node tools/verify_journal_fault_browser_report.mjs "$TMPDIR/journal-fault-browser.json"
      - name: Run real F13 hostile-origin browser acceptance
        if: always()
        run: node tools/run_hostile_origin_browser_acceptance.mjs --report="$TMPDIR/hostile-origin-browser.json"
      - name: Require current-package hostile-origin evidence and owned cleanup
        if: always()
        run: node tools/verify_hostile_origin_browser_report.mjs "$TMPDIR/hostile-origin-browser.json"
      # F05 genuine broker capacity overflow: real two-attempt journals and
      # bounded broker overflow evidence, not a synthetic disconnect control.
      - name: Check F05 genuine broker-overflow Python fixture contract
        run: python -m pytest unit_tests/test_genuine_broker_overflow_browser_fixture.py -q
      - name: Check F05 genuine broker-overflow Node contracts
        run: node --test tools/run_genuine_broker_overflow_browser_acceptance.test.mjs tools/verify_genuine_broker_overflow_browser_report.test.mjs
      - name: Run real F05 genuine broker-overflow browser acceptance
        if: always()
        run: node tools/run_genuine_broker_overflow_browser_acceptance.mjs --report="$TMPDIR/genuine-broker-overflow-browser.json"
      - name: Require current-package genuine broker-overflow evidence and owned cleanup
        if: always()
        run: node tools/verify_genuine_broker_overflow_browser_report.mjs "$TMPDIR/genuine-broker-overflow-browser.json"
      - name: Run retained native concurrency acceptance
        if: always()
        run: node tools/run_retained_concurrency_acceptance.mjs --fixtures="$TMPDIR/retained-builds/summary.json" --report="$TMPDIR/retained-concurrency.json"
      - name: Verify retained native concurrency evidence
        if: always()
        run: node tools/verify_retained_concurrency_report.mjs "$TMPDIR/retained-concurrency.json" "$TMPDIR/retained-builds/summary.json"
      - name: Run real partial-best fallback browser acceptance
        if: always()
        run: |
          mkdir -m 700 "$TMPDIR/partial-best-fallback"
          TMPDIR="$TMPDIR/partial-best-fallback" node tools/run_web_acceptance.mjs --case=partial-best-fallback
      - name: Require exact partial-best fallback source, PNG and cleanup evidence
        if: always()
        run: |
          node --input-type=module - "$TMPDIR/partial-best-fallback" <<'JS'
          import assert from 'node:assert/strict';
          import { readdir, lstat } from 'node:fs/promises';
          import { join } from 'node:path';
          import { verifyPartialBestReport } from './tools/verify_partial_best_browser_report.mjs';
          const root = process.argv[2], entries = await readdir(root);
          assert.equal(entries.length, 1, 'Exactly one owned fallback workspace required');
          assert(/^wavedl-browser-acceptance-[A-Za-z0-9]+$/.test(entries[0]));
          const workspace = join(root, entries[0]), info = await lstat(workspace);
          assert(info.isDirectory() && !info.isSymbolicLink());
          const record = await verifyPartialBestReport(join(workspace, 'summary.json'));
          assert.equal(record.name, 'partial-best-fallback');
          JS
      - name: Run real partial-best refusal browser acceptance
        if: always()
        run: |
          mkdir -m 700 "$TMPDIR/partial-best-refusal"
          TMPDIR="$TMPDIR/partial-best-refusal" node tools/run_web_acceptance.mjs --case=partial-best-refusal
      - name: Require exact partial-best refusal, durable counts and cleanup evidence
        if: always()
        run: |
          node --input-type=module - "$TMPDIR/partial-best-refusal" <<'JS'
          import assert from 'node:assert/strict';
          import { readdir, lstat } from 'node:fs/promises';
          import { join } from 'node:path';
          import { verifyPartialBestReport } from './tools/verify_partial_best_browser_report.mjs';
          const root = process.argv[2], entries = await readdir(root);
          assert.equal(entries.length, 1, 'Exactly one owned refusal workspace required');
          assert(/^wavedl-browser-acceptance-[A-Za-z0-9]+$/.test(entries[0]));
          const workspace = join(root, entries[0]), info = await lstat(workspace);
          assert(info.isDirectory() && !info.isSymbolicLink());
          const record = await verifyPartialBestReport(join(workspace, 'summary.json'));
          assert.equal(record.name, 'partial-best-refusal');
          JS
      - name: Run real automatic-plot metadata checksum refusal browser acceptance
        if: always()
        run: |
          mkdir -m 700 "$TMPDIR/autoplot-metadata-integrity"
          TMPDIR="$TMPDIR/autoplot-metadata-integrity" node tools/run_web_acceptance.mjs --case=autoplot-metadata-integrity
      - name: Require exact metadata checksum refusal, no fallback and cleanup evidence
        if: always()
        run: |
          node --input-type=module - "$TMPDIR/autoplot-metadata-integrity" <<'JS'
          import assert from 'node:assert/strict';
          import { readdir, lstat } from 'node:fs/promises';
          import { join } from 'node:path';
          import { verifyAutoplotMetadataIntegrityReport } from './tools/verify_autoplot_metadata_integrity_report.mjs';
          const root = process.argv[2], entries = await readdir(root);
          assert.equal(entries.length, 1, 'Exactly one owned metadata-integrity workspace required');
          assert(/^wavedl-browser-acceptance-[A-Za-z0-9]+$/.test(entries[0]));
          const workspace = join(root, entries[0]), info = await lstat(workspace);
          assert(info.isDirectory() && !info.isSymbolicLink());
          const record = await verifyAutoplotMetadataIntegrityReport(join(workspace, 'summary.json'));
          assert.equal(record.name, 'autoplot-metadata-integrity');
          JS
      # A genuine factory build identity changes; no new binary or cache-hit claim.
      - name: Run cached controller and controlled build replacement acceptance
        if: always()
        run: |
          mkdir -m 700 "$TMPDIR/cached-build-replacement-browser"
          TMPDIR="$TMPDIR/cached-build-replacement-browser" node tools/run_web_acceptance.mjs --case=cached-build-replacement
