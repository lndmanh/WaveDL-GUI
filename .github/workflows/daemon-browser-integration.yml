          const record = await verifyCachedBuildReplacementReport(join(workspace, 'summary.json'));
          assert.equal(record.name, 'cached-build-replacement');
          JS
      - name: Run instrumented native Fetch SSE split acceptance
        if: always()
        run: |
          mkdir -m 700 "$TMPDIR/native-sse-browser"
          TMPDIR="$TMPDIR/native-sse-browser" node tools/run_native_sse_split_browser_acceptance.mjs --report="$TMPDIR/native-sse-browser/native-sse.json"
      - name: Require exact native SSE report, current assets and owned cleanup
        if: always()
        run: |
          node --input-type=module - "$TMPDIR/native-sse-browser" <<'JS'
          import assert from 'node:assert/strict';
          import { readdir, lstat } from 'node:fs/promises';
          import { join } from 'node:path';
          import { verifyNativeSseSplitFile } from './tools/verify_native_sse_split_report.mjs';
          const root = process.argv[2], info = await lstat(root);
          assert(info.isDirectory() && !info.isSymbolicLink());
          assert.deepEqual(await readdir(root), ['native-sse.json']);
          const report = await verifyNativeSseSplitFile(join(root, 'native-sse.json'));
          assert.equal(report.scope, 'instrumented-native-sse-split');
          JS
