name: Daemon browser integration

on:
  push:
    paths: &integration-paths
      - "src/wavedl/**"
      - "src/wavedl_daemon/**"
      - "src/wavedl_daemon/web/**"
      - "tools/**"
      - "unit_tests/**"
      - "pyproject.toml"
      - ".github/workflows/daemon-browser-integration.yml"
      - "unit_tests/test_cv_deterministic.py"
      - "unit_tests/test_cv_workers.py"
      - "unit_tests/test_cv_option_fidelity.py"
      - "unit_tests/test_cv_training_semantics.py"
      - "unit_tests/test_cv_physical_components.py"
      - "unit_tests/test_data_cv.py"
      - "unit_tests/test_cv_workflow.py"
      - "unit_tests/test_training_onecycle_accumulation.py"
      - "src/wavedl/utils/cv_components.py"
  pull_request:
    paths: *integration-paths
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: daemon-browser-integration-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  chromium-cpu:
    name: Chromium + vendored app + real CPU daemon
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      MPLBACKEND: Agg
      CUDA_VISIBLE_DEVICES: ""
      OMP_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
      OPENBLAS_NUM_THREADS: "1"
      NUMEXPR_NUM_THREADS: "1"
      PYTHONFAULTHANDLER: "1"
      PYTHONUNBUFFERED: "1"
      WANDB_MODE: disabled
      WAVEDL_PYTHON: python
    steps:
      - name: Create dedicated job temporary directory
        run: |
          export TMPDIR="$RUNNER_TEMP/wavedl-browser-ci"
          mkdir -m 700 -p "$TMPDIR"
          printf 'TMPDIR=%s\n' "$TMPDIR" >> "$GITHUB_ENV"
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: src/wavedl_daemon/web/package-lock.json
      - name: Install CPU PyTorch before project dependencies
        run: python -m pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu
      - name: Install real daemon and ML dependencies
        run: python -m pip install -e ".[dev,daemon]"
      - name: Verify installed dependency and CPU data contracts
        run: |
          python -m pip check
          python -c 'import torch, torchvision, numpy, scipy, h5py, starlette, uvicorn, fastapi, pydantic; assert torch.version.cuda is None, "CPU PyTorch required"'
      - name: Install locked web dependencies
        working-directory: src/wavedl_daemon/web
        run: npm ci
      - name: Require exhaustive field and effective Python export round trips
        working-directory: src/wavedl_daemon/web
        env:
          WAVEDL_TRAINING_EXPORT_PYTHON: python
        run: npm test -- test/workstation/training-fields-acceptance.test.ts
      - name: Generate the static app used by the daemon
        working-directory: src/wavedl_daemon/web
        run: npm run generate
      - name: Vendor verified generated assets into the daemon
        run: python tools/vendor_web_assets.py
      - name: Capture exact generated asset manifest for evidence
        run: cp -- src/wavedl_daemon/web_assets/.wavedl-assets.json "$TMPDIR/browser-build-manifest.json"
      - name: Install pinned browser CLI and Chromium runtime
        run: |
          npm install --global agent-browser@0.26.0
          test "$(agent-browser --version)" = 'agent-browser 0.26.0'
          agent-browser skills get core
          agent-browser install --with-deps

      - name: Run all mandatory baseline browser acceptance cases
        run: node tools/run_web_acceptance.mjs
      - name: Require all baseline cases, current assets and owned cleanup
        if: always()
        run: node tools/verify_browser_ci_report.mjs "$TMPDIR"

      - name: Run same-daemon authentication and skew browser acceptance
        if: ${{ !cancelled() }}
        run: node tools/run_auth_skew_browser_acceptance.mjs --report="$TMPDIR/auth-skew.json"
      - name: Verify same-daemon authentication and skew evidence
        if: always()
        run: node tools/verify_auth_skew_browser_report.mjs "$TMPDIR/auth-skew.json"
      - name: Run real journal-byte fault browser acceptance
        if: ${{ !cancelled() }}
        run: node tools/run_journal_fault_browser_acceptance.mjs --report="$TMPDIR/journal-fault-browser.json"
      - name: Verify journal-byte fault evidence and cleanup
        if: always()
        run: node tools/verify_journal_fault_browser_report.mjs "$TMPDIR/journal-fault-browser.json"
      - name: Run hostile-origin browser acceptance
        if: ${{ !cancelled() }}
        run: node tools/run_hostile_origin_browser_acceptance.mjs --report="$TMPDIR/hostile-origin-browser.json"
      - name: Verify hostile-origin evidence and cleanup
        if: always()
        run: node tools/verify_hostile_origin_browser_report.mjs "$TMPDIR/hostile-origin-browser.json"
      - name: Run read-only storage-fault browser acceptance
        if: ${{ !cancelled() }}
        run: node tools/run_storage_fault_browser_acceptance.mjs --report="$TMPDIR/storage-fault-query-only.json" query_only
      - name: Verify read-only storage-fault evidence
        if: always()
        run: node tools/verify_storage_fault_browser_report.mjs "$TMPDIR/storage-fault-query-only.json" query_only
      - name: Run quota storage-fault browser acceptance
        if: ${{ !cancelled() }}
        run: node tools/run_storage_fault_browser_acceptance.mjs --report="$TMPDIR/storage-fault-page-quota.json" page_quota
      - name: Verify quota storage-fault evidence
        if: always()
        run: node tools/verify_storage_fault_browser_report.mjs "$TMPDIR/storage-fault-page-quota.json" page_quota

      - name: Exercise POSIX registry crash and recovery paths
        env:
          WAVEDL_REGISTRY_RECOVERY_REPORT_DIR: ${{ runner.temp }}/wavedl-browser-ci/registry-http-recovery
        run: python -m pytest unit_tests/daemon/test_registry_http_recovery.py --junitxml="$TMPDIR/registry-http-recovery.xml"
      - name: Require complete registry rollback, recovery and cleanup evidence
        if: always()
        run: |
          python tools/verify_registry_http_recovery_report.py "$TMPDIR/registry-http-recovery/registry-http-recovery-projection-cursor-rebuild.json" "$TMPDIR/registry-http-recovery/registry-http-recovery-projection-cursor-ingest.json" "$TMPDIR/registry-http-recovery/registry-http-recovery-cursor-projection-rebuild.json" "$TMPDIR/registry-http-recovery/registry-http-recovery-cursor-projection-ingest.json"
          python - <<'PY'
          import os
          import xml.etree.ElementTree as ET
          from pathlib import Path
          root = ET.parse(Path(os.environ["TMPDIR"]) / "registry-http-recovery.xml").getroot()
          cases = list(root.iter("testcase"))
          assert len(cases) == 33
          assert len({(case.get("classname"), case.get("name")) for case in cases}) == 33
          assert all(case.get("classname") == "unit_tests.daemon.test_registry_http_recovery" for case in cases)
          assert not any(list(root.iter(kind)) for kind in ("skipped", "failure", "error"))
          PY
      - name: Exercise metric-bearing registry crash and recovery paths
        env:
          WAVEDL_REGISTRY_METRIC_RECOVERY_REPORT_DIR: ${{ runner.temp }}/wavedl-browser-ci/registry-metric-http-recovery
        run: python -m pytest unit_tests/daemon/test_registry_metric_http_recovery.py --junitxml="$TMPDIR/registry-metric-http-recovery.xml"
      - name: Require complete metric recovery, HTTP values and cleanup evidence
        if: always()
        run: |
          python tools/verify_registry_metric_http_recovery_report.py "$TMPDIR/registry-metric-http-recovery/registry-metric-http-recovery-projection-cursor-rebuild.json" "$TMPDIR/registry-metric-http-recovery/registry-metric-http-recovery-projection-cursor-ingest.json" "$TMPDIR/registry-metric-http-recovery/registry-metric-http-recovery-cursor-projection-rebuild.json" "$TMPDIR/registry-metric-http-recovery/registry-metric-http-recovery-cursor-projection-ingest.json"
          python - <<'PY'
          import os
          import xml.etree.ElementTree as ET
          from pathlib import Path
          root = ET.parse(Path(os.environ["TMPDIR"]) / "registry-metric-http-recovery.xml").getroot()
          cases = list(root.iter("testcase"))
          assert len(cases) == 33
          assert len({(case.get("classname"), case.get("name")) for case in cases}) == 33
          assert all(case.get("classname") == "unit_tests.daemon.test_registry_metric_http_recovery" for case in cases)
          matrix = {f"test_metric_transaction_sigkill_preserves_prefix_and_recovers_once[{recovery}-{order}]" for recovery in ("rebuild", "ingest") for order in ("projection-cursor", "cursor-projection")}
          assert {case.get("name") for case in cases if case.get("name", "").startswith("test_metric_transaction_")} == matrix
          assert not any(list(root.iter(kind)) for kind in ("skipped", "failure", "error"))
          PY

      - name: Test F01 submission crash recovery with exact JUnit contract
        run: python -m pytest unit_tests/daemon/test_submission_http_crash_recovery.py --junitxml="$TMPDIR/submission-http-crash-recovery.xml"
      - name: Require all six F01 crash-recovery boundaries with no skips
        if: always()
        run: |
          python - <<'PY'
          import os
          import xml.etree.ElementTree as ET
          from pathlib import Path
          root = ET.parse(Path(os.environ["TMPDIR"]) / "submission-http-crash-recovery.xml").getroot()
          cases = list(root.iter("testcase"))
          expected = {
              f"test_http_acceptance_crash_same_db_recovery[{boundary}-{recovery}]"
              for boundary, recovery in (
                  ("intent", "unique"), ("claim", "missing"),
                  ("acceptance", "unique"), ("acceptance", "missing"),
                  ("acceptance", "ambiguous"), ("receipt", "unique"),
              )
          }
          assert len(cases) == 6
          assert {case.get("name") for case in cases} == expected
          assert all(case.get("classname") == "unit_tests.daemon.test_submission_http_crash_recovery" for case in cases)
          assert not any(list(root.iter(kind)) for kind in ("skipped", "failure", "error"))
          PY

      - name: Test CV mandatory product acceptance contracts
        run: python -m pytest --noconftest unit_tests/test_cv_workflow.py
      - name: Test optimizer-update OneCycle schedules and checkpoint resume
        run: python -m pytest unit_tests/test_training_onecycle_accumulation.py --junitxml="$TMPDIR/onecycle-updates.xml"
      - name: Require CPU and native DDP OneCycle acceptance with zero skips
        if: always()
        run: |
          python - <<'PY'
          import os
          import xml.etree.ElementTree as ET
          from pathlib import Path
          root = ET.parse(Path(os.environ["TMPDIR"]) / "onecycle-updates.xml").getroot()
          cases = list(root.iter("testcase"))
          assert len(cases) == 7
          assert all(case.get("classname") == "unit_tests.test_training_onecycle_accumulation" for case in cases)
          assert len({case.get("name") for case in cases}) == 7
          assert not any(list(root.iter(kind)) for kind in ("skipped", "failure", "error"))
          PY
      - name: Test real CPU cross-validation options, constraints, precision and determinism
        run: python -m pytest unit_tests/test_cv_option_fidelity.py unit_tests/test_cv_training_semantics.py unit_tests/test_cv_physical_components.py unit_tests/test_cv_deterministic.py unit_tests/test_cv_workers.py unit_tests/test_data_cv.py --junitxml="$TMPDIR/cv-option-fidelity.xml"
      - name: Require all CV semantics cases with zero skips
        if: always()
        run: |
          python - <<'PY'
          import os
          import xml.etree.ElementTree as ET
          from collections import Counter
          from pathlib import Path
          root = ET.parse(Path(os.environ["TMPDIR"]) / "cv-option-fidelity.xml").getroot()
          cases = list(root.iter("testcase"))
          assert len(cases) == 104
          families = ["unit_tests.test_data_cv" if case.get("classname", "").startswith("unit_tests.test_data_cv.") else case.get("classname") for case in cases]
          assert all(family in {"unit_tests.test_cv_option_fidelity", "unit_tests.test_cv_training_semantics", "unit_tests.test_cv_physical_components", "unit_tests.test_cv_deterministic", "unit_tests.test_cv_workers", "unit_tests.test_data_cv"} for family in families)
          assert len({(case.get("classname"), case.get("name")) for case in cases}) == 104
          assert Counter(families) == Counter({"unit_tests.test_cv_option_fidelity": 21, "unit_tests.test_cv_training_semantics": 20, "unit_tests.test_cv_physical_components": 11, "unit_tests.test_cv_deterministic": 6, "unit_tests.test_cv_workers": 7, "unit_tests.test_data_cv": 39})
          required_data_cases = {
              "test_cross_validation_rejects_invalid_input_contract[X0-y0-2-samples and targets]",
              "test_cross_validation_rejects_invalid_input_contract[X1-y1-2-same number of samples]",
              "test_cross_validation_rejects_invalid_input_contract[X2-y2-2-at least 2 dimensions]",
              "test_cross_validation_rejects_invalid_input_contract[X3-y3-5-at least 5 samples]",
              "test_cross_validation_rejects_nonfinite_input_contract",
              "test_cross_validation_rejects_non_numeric_input_contract",
          }
          assert required_data_cases <= {case.get("name") for case in cases if case.get("classname") == "unit_tests.test_data_cv"}
          assert not any(list(root.iter(kind)) for kind in ("skipped", "failure", "error"))
          PY
      - name: Test numerical runtime operations and public cancellation behavior
        run: >-
          python -m pytest unit_tests/test_runtime_operations.py
          unit_tests/test_hosted_operation_result_quality.py
          unit_tests/daemon/test_pending_cancellation_http.py
          --junitxml="$TMPDIR/numerical-runtime.xml" -q
      - name: Require three hosted numerical failures with zero skips
        if: always()
        run: |
          python - <<'PY'
          import os
          import xml.etree.ElementTree as ET
          from pathlib import Path
          root = ET.parse(Path(os.environ["TMPDIR"]) / "numerical-runtime.xml").getroot()
          cases = list(root.iter("testcase"))
          expected = {
              "test_public_http_evaluation_failure_preserves_training_publication[nan]",
              "test_public_http_evaluation_failure_preserves_training_publication[inf]",
              "test_public_http_evaluation_failure_preserves_training_publication[empty]",
          }
          actual = {case.get("name") for case in cases if case.get("classname", "").endswith("test_hosted_operation_result_quality")}
          assert cases and actual == expected
          assert not any(list(root.iter(kind)) for kind in ("failure", "error", "skipped"))
          PY

      - name: Upload nonsecret browser and product-gate evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-acceptance-ubuntu-py3.11-node24
          path: |
            ${{ runner.temp }}/wavedl-browser-ci/browser-build-manifest.json
            ${{ runner.temp }}/wavedl-browser-ci/wavedl-browser-acceptance-*/summary.json
            ${{ runner.temp }}/wavedl-browser-ci/wavedl-browser-acceptance-*/baseline.json
            ${{ runner.temp }}/wavedl-browser-ci/wavedl-browser-acceptance-*/detach.json
            ${{ runner.temp }}/wavedl-browser-ci/wavedl-browser-acceptance-*/reload.json
            ${{ runner.temp }}/wavedl-browser-ci/wavedl-browser-acceptance-*/cancel.json
            ${{ runner.temp }}/wavedl-browser-ci/wavedl-browser-acceptance-*/lost-ack.json
            ${{ runner.temp }}/wavedl-browser-ci/wavedl-browser-acceptance-*/artifact-tamper.json
            ${{ runner.temp }}/wavedl-browser-ci/wavedl-browser-acceptance-*/port-reuse.json
            ${{ runner.temp }}/wavedl-browser-ci/wavedl-browser-acceptance-*/live-port-reuse.json
            ${{ runner.temp }}/wavedl-browser-ci/wavedl-browser-acceptance-*/authoring-parity.json
            ${{ runner.temp }}/wavedl-browser-ci/wavedl-browser-acceptance-*/download-names.json
            ${{ runner.temp }}/wavedl-browser-ci/wavedl-browser-acceptance-*/dataset-parity.json
            ${{ runner.temp }}/wavedl-browser-ci/auth-skew.json
            ${{ runner.temp }}/wavedl-browser-ci/journal-fault-browser.json
            ${{ runner.temp }}/wavedl-browser-ci/hostile-origin-browser.json
            ${{ runner.temp }}/wavedl-browser-ci/storage-fault-query-only.json
            ${{ runner.temp }}/wavedl-browser-ci/storage-fault-page-quota.json
            ${{ runner.temp }}/wavedl-browser-ci/registry-http-recovery.xml
            ${{ runner.temp }}/wavedl-browser-ci/registry-metric-http-recovery.xml
            ${{ runner.temp }}/wavedl-browser-ci/submission-http-crash-recovery.xml
            ${{ runner.temp }}/wavedl-browser-ci/onecycle-updates.xml
            ${{ runner.temp }}/wavedl-browser-ci/cv-option-fidelity.xml
            ${{ runner.temp }}/wavedl-browser-ci/numerical-runtime.xml
            ${{ runner.temp }}/wavedl-browser-ci/registry-http-recovery/*.json
            ${{ runner.temp }}/wavedl-browser-ci/registry-metric-http-recovery/*.json
          if-no-files-found: warn
