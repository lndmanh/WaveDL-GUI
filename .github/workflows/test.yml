# WaveDL CI/CD Pipeline
# ======================
# Runs unit tests on every push and pull request to ensure code quality.
#
# Features:
#   - Python 3.11 / 3.12 / 3.13 matrix
#   - Dependency caching for faster runs
#   - CPU-only testing (GPU tests skipped on CI)

name: Tests

on:
  push:
    branches: [main, 'review/daemon-browser-ci-*']
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12', '3.13']

    env:
      MPLBACKEND: Agg
      CUDA_VISIBLE_DEVICES: ""
      OMP_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
      OPENBLAS_NUM_THREADS: "1"
      NUMEXPR_NUM_THREADS: "1"
      PYTHONFAULTHANDLER: "1"
      PYTHONUNBUFFERED: "1"
      WANDB_MODE: disabled

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      # Vendored web-asset fixtures exercise the Node manifest producer.
      # This is a test/build tool, not a dependency of the daemon runtime.
      - name: Set up Node for web-asset producer tests
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install locked browser dependencies
        working-directory: web
        run: npm ci

      - name: Generate the browser client from the locked source
        working-directory: web
        run: npm run generate

      - name: Cache pip dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-py${{ matrix.python-version }}-pip-${{ hashFiles('pyproject.toml') }}
          restore-keys: |
            ${{ runner.os }}-py${{ matrix.python-version }}-pip-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -e ".[dev,daemon]"

      - name: Verify installed dependency contracts
        run: python -m pip check

      - name: Vendor generated browser assets before package tests
        run: python tools/vendor_web_assets.py

      # Keep dependency resolution distinct from the cheap --system-site-packages
      # wheel smoke tests. This one cell supplies an explicit complete wheelhouse;
      # missing dependencies are failures, not accepted optional skips.
      - name: Prepare an isolated CPU wheelhouse
        if: matrix.python-version == '3.11'
        run: |
          python -m pip freeze --exclude-editable > "$RUNNER_TEMP/wheel-constraints.txt"
          python -m pip wheel ".[daemon]" --only-binary=:all: --wheel-dir "$RUNNER_TEMP/wavedl-wheelhouse" --constraint "$RUNNER_TEMP/wheel-constraints.txt" --extra-index-url https://download.pytorch.org/whl/cpu

      - name: Require dependency-resolved wheel installation outside the checkout
        if: matrix.python-version == '3.11'
        env:
          WAVEDL_ACCEPTANCE_WHEELHOUSE: ${{ runner.temp }}/wavedl-wheelhouse
        run: python -m pytest unit_tests/daemon/test_installed_cli.py --noconftest -k isolated_resolved -v --junitxml=isolated-wheel.xml

      # The supported suite covers core ML, daemon, cleanup and native CPU DDP.
      # Retained historical Qt tests are excluded by unit_tests/conftest.py.
      - name: Run unit tests (skip slow architecture and GPU tests)
        run: python -m pytest unit_tests/ -v --tb=short -m "not slow and not gpu" --junitxml=unit-tests.xml

      - name: Upload unit test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-tests-py${{ matrix.python-version }}
          path: |
            unit-tests.xml
            isolated-wheel.xml
          if-no-files-found: warn
